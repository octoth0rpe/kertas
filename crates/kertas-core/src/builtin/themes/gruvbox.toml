# Gruvbox, by morhetz: https://github.com/morhetz/gruvbox
# MIT/X11 License.
#
# A few colors are darkened (light) or lightened (dark) just enough to
# reach WCAG AA's 4.5:1 for text. Each says what it was.
name = "Gruvbox"

[light]
background = "#fbf1c7"
text = "#3c3836"
muted_text = "#786b61"  # was #7c6f64
link = "#076678"
code_background = "#ebdbb2"
rule = "#d5c4a1"
table_header_background = "#f2e5bc"
selection = "#07667840"
caret = "#076678"
accent_text = "#fbf1c7"
revealed_background = "#0766780a"
revealed_border = "#07667840"
alert_note = "#076678"
alert_tip = "#74700d"  # was #79740e
alert_important = "#8f3f71"
alert_warning = "#976311"  # was #b57614
alert_caution = "#9d0006"

[dark]
background = "#282828"
text = "#ebdbb2"
muted_text = "#a89984"
link = "#83a598"
code_background = "#3c3836"
rule = "#504945"
table_header_background = "#32302f"
selection = "#83a5984d"
caret = "#83a598"
accent_text = "#282828"
revealed_background = "#83a5980f"
revealed_border = "#83a59847"
alert_note = "#83a598"
alert_tip = "#b8bb26"
alert_important = "#d3869b"
alert_warning = "#fabd2f"
alert_caution = "#fb5441"  # was #fb4934
