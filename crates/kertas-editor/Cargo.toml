[package]
name = "kertas-editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The GPUI view that shows and edits a Markdown document, for an app to
# put in its own windows. It re-exports GPUI, so the app uses the same one.
[dependencies]
kertas-core.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
futures.workspace = true
# Moving by grapheme in text fields.
unicode-segmentation.workspace = true
# Editing the settings file in place, keeping its comments.
toml_edit.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# Watching files with kqueue (src/file_watch.rs).
libc.workspace = true
# The alert sound for a link to a heading that doesn't exist, and
# printing (src/print.rs). Same versions GPUI uses.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSAttributedString", "NSColor", "NSFont", "NSFontManager", "NSGraphics", "NSImage", "NSLayoutManager", "NSParagraphStyle", "NSPrintInfo", "NSPrintOperation", "NSResponder", "NSText", "NSTextAttachment", "NSTextContainer", "NSTextStorage", "NSTextTable", "NSTextView", "NSView", "NSWindow"] }
# Printing lays text out in points.
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
# Printing, and fetching web images with the system's URL loading
# (src/web_images.rs).
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSArray", "NSAttributedString", "NSData", "NSDictionary", "NSError", "NSGeometry", "NSRange", "NSString", "NSURL", "NSURLResponse", "NSURLSession", "NSValue"] }
block2 = "0.6"
# The NSWindow behind a GPUI window, to print as a sheet on it.
raw-window-handle = "0.6"

[dev-dependencies]
# Headless windows and a test clock, for unit tests of the view.
gpui = { workspace = true, features = ["test-support"] }
# The real macOS text system, for tests that lay text out as the app does.
[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui_apple = { git = "https://github.com/zed-industries/zed", rev = "c66312b200d113694fca08c1d468669028a09a0e" }

[lints]
workspace = true
