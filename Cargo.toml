[package]
name = "kami"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
# GPUI is pinned to a Zed commit; see docs/planning/gpui-research.md.
# Bump deliberately and expect breaking changes.
gpui = { git = "https://github.com/zed-industries/zed", rev = "c66312b200d113694fca08c1d468669028a09a0e" }
# `runtime_shaders` compiles Metal shaders at runtime, so building doesn't require full Xcode.
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "c66312b200d113694fca08c1d468669028a09a0e", features = ["font-kit", "runtime_shaders"] }
futures = "0.3"
pulldown-cmark = { version = "0.13.4", default-features = false }
ropey = "1.6"
unicode-segmentation = "1"
toml_edit = "0.25.17"

[lints.clippy]
# kami often builds lists of byte ranges, including lists with one range.
single_range_in_vec_init = "allow"

[target.'cfg(target_os = "macos")'.dependencies]
# Native window tabs (see src/native_tabs.rs). Same versions GPUI uses.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder", "NSView", "NSWindow", "NSWindowTabGroup"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSString", "NSUserDefaults"] }
raw-window-handle = "0.6"
