[workspace]
members = [".", "crates/kertas-core", "crates/kertas-editor"]
# So cargo test, clippy and build cover every crate.
default-members = [".", "crates/kertas-core", "crates/kertas-editor"]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/octoth0rpe/kertas"

[workspace.dependencies]
kertas-core = { path = "crates/kertas-core" }
kertas-editor = { path = "crates/kertas-editor" }
# GPUI is pinned to a Zed commit.
# Bump deliberately and expect breaking changes.
gpui = { git = "https://github.com/zed-industries/zed", rev = "c66312b200d113694fca08c1d468669028a09a0e" }
# `runtime_shaders` compiles Metal shaders at runtime, so building doesn't require full Xcode.
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "c66312b200d113694fca08c1d468669028a09a0e", features = ["font-kit", "runtime_shaders"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
ropey = "1.6"
unicode-segmentation = "1"
toml_edit = "0.25.17"
futures = "0.3"
libc = "0.2"

[workspace.lints.clippy]
# kertas often builds lists of byte ranges, including lists with one range.
single_range_in_vec_init = "allow"

[package]
name = "kertas"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
kertas-core.workspace = true
kertas-editor.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
futures.workspace = true
ropey.workspace = true
toml_edit.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# Native window tabs (see src/native_tabs.rs). Same versions GPUI uses.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-foundation", "objc2-uniform-type-identifiers", "NSApplication", "NSAttributedString", "NSColor", "NSFont", "NSFontManager", "NSGraphics", "NSImage", "NSLayoutManager", "NSParagraphStyle", "NSPrintInfo", "NSPrintOperation", "NSResponder", "NSRunningApplication", "NSText", "NSTextAttachment", "NSTextStorage", "NSTextTable", "NSTextView", "NSView", "NSWindow", "NSWindowTabGroup", "NSWorkspace"] }
# Printing (src/print.rs) lays text out in points.
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-uniform-type-identifiers = { version = "0.3", default-features = false, features = ["std", "UTType"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSArray", "NSAttributedString", "NSBundle", "NSData", "NSDictionary", "NSDistributedNotificationCenter", "NSError", "NSGeometry", "NSNotification", "NSOperation", "NSRange", "NSString", "NSURL", "NSURLResponse", "NSURLSession", "NSUserDefaults", "NSValue"] }
block2 = "0.6"
libc.workspace = true
raw-window-handle = "0.6"
